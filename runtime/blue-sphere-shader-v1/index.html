<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Relay · Blue Sphere Shader v1</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f1ea;--muted:#938f88;--line:#2a2926;--panel:rgba(13,13,12,.82);--accent:#3d9bff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030408;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;z-index:20;top:16px;left:16px;width:min(430px,calc(100vw - 32px));padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(24px);box-shadow:0 18px 60px #0008}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:760;letter-spacing:-.02em}
    .badge{font:700 9px/1 ui-monospace,monospace;letter-spacing:.13em;color:#9fd0f0;border:1px solid #28455f;border-radius:999px;padding:7px 9px}
    .controls{display:grid;grid-template-columns:70px 1fr 42px;gap:8px;align-items:center;margin-top:12px;font-size:10px;color:var(--muted)}
    input[type=range]{width:100%;height:4px;padding:0;accent-color:var(--accent)}
    button{border:1px solid var(--line);background:#131720;color:var(--ink);border-radius:10px;padding:9px 11px;font:600 11px/1.2 inherit;cursor:pointer;margin-top:12px;width:100%}
    button:hover{border-color:#2e4a6e;background:#121d2c}
    .status{margin:11px 0 0;color:var(--muted);font:500 10px/1.45 ui-monospace,monospace}.status b{color:#cfe0f0}
    .hint{position:fixed;z-index:10;right:18px;bottom:18px;color:#aaa39a;background:#0e0e0dcc;border:1px solid #242321;border-radius:999px;padding:9px 12px;font:600 10px/1 ui-monospace,monospace;pointer-events:none}
  </style>
  <!-- Pinned source of record: three@0.183.2. Local vendor/ copies hold the
       hashed provenance snapshot; the embedded verification browser only loads
       modules over https, so runtime imports use the same pinned CDN URLs. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>

  <section class="hud" aria-label="Blue sphere shader controls">
    <div class="top">
      <div class="brand">Relay · Blue Sphere Shader</div>
      <div class="badge">three r0.183.2 · SOURCE PRESERVED</div>
    </div>
    <div class="controls">
      <label for="morph">Morph</label><input id="morph" type="range" min="0" max="1" step=".001" value=".5"><output>.500</output>
      <label for="flow">Flow</label><input id="flow" type="range" min="0" max="1" step=".001" value=".5"><output>.500</output>
      <label for="heat">Heat</label><input id="heat" type="range" min="0" max="1" step=".001" value=".5"><output>.500</output>
    </div>
    <button id="exportBtn" type="button">Export GLB · pinned GLTFExporter r0.183.2</button>
    <p class="status" id="status"><b>Booting live GLSL runtime…</b></p>
  </section>
  <div class="hint">Drag to rotate · pointer drives the shader</div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFExporter } from "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/exporters/GLTFExporter.js";

    const canvas = document.querySelector("#gl");
    const statusEl = document.querySelector("#status");
    const controls = ["morph", "flow", "heat"];
    const setStatus = (title, detail = "") => { statusEl.innerHTML = `<b>${title}</b><br>${detail}`; };

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030408);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 50);
    camera.position.set(0, 0, 3.2);

    // Shared GLSL: displacement + surface color, used identically by the live
    // material and the UV-space bake pass so the derivative matches the source.
    const SHARED_GLSL = /* glsl */`
      float relayDisp(vec3 p, float T, float uMorph) {
        return uMorph * (
          0.10 * sin(p.x * 5.0 + T * 1.4) * sin(p.y * 4.0 - T * 1.1)
        + 0.08 * sin(p.z * 6.0 + T * 1.7)
        + 0.05 * sin((p.x + p.y + p.z) * 8.0 - T * 2.0)
        );
      }
      vec3 relaySurface(vec3 n, float T, float uFlow, float uHeat) {
        vec3 deep = vec3(0.020, 0.080, 0.350);
        vec3 band = vec3(0.050, 0.450, 0.950);
        float b = 0.5 + 0.5 * sin(n.y * 10.0 - T * 2.0 + sin(n.x * 6.0 + T) * 1.5);
        float pulse = 0.5 + 0.5 * sin(T * 3.0);
        vec3 c = mix(deep, band, b * (0.25 + 0.75 * uFlow));
        c += uHeat * pulse * b * vec3(0.30, 0.70, 1.00) * 0.6;
        return c;
      }
    `;

    const uniforms = {
      uTime:    { value: 0 },
      uMorph:   { value: 0.5 },
      uFlow:    { value: 0.5 },
      uHeat:    { value: 0.5 },
      uPointer: { value: new THREE.Vector3(0, 0, 1) },
    };

    const liveMaterial = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: /* glsl */`
        uniform float uTime; uniform float uMorph; uniform float uFlow;
        varying vec3 vNormal; varying vec3 vPos;
        ${SHARED_GLSL}
        void main() {
          float T = uTime * (0.4 + uFlow * 1.2);
          vec3 n = normalize(position);
          vec3 displaced = position + n * relayDisp(n, T, uMorph);
          vNormal = normalMatrix * n;
          vPos = (modelViewMatrix * vec4(displaced, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime; uniform float uMorph; uniform float uFlow; uniform float uHeat;
        uniform vec3 uPointer;
        varying vec3 vNormal; varying vec3 vPos;
        ${SHARED_GLSL}
        void main() {
          float T = uTime * (0.4 + uFlow * 1.2);
          vec3 n = normalize(vNormal);
          vec3 viewDir = normalize(-vPos);
          vec3 c = relaySurface(n, T, uFlow, uHeat);
          float fres = pow(1.0 - clamp(dot(n, viewDir), 0.0, 1.0), 2.5);
          c += fres * (0.4 + uHeat) * vec3(0.25, 0.65, 1.00);
          float spot = pow(clamp(dot(n, normalize(uPointer)), 0.0, 1.0), 8.0);
          c += spot * 0.35 * vec3(0.5, 0.8, 1.0);
          gl_FragColor = vec4(c, 1.0);
        }
      `,
    });

    const RADIUS = 1;
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 128, 96), liveMaterial);
    sphere.name = "BlueSphere_Live";
    scene.add(sphere);

    // ---- Pointer interaction: move drives shader spotlight, drag rotates ----
    let dragging = false, lastX = 0, lastY = 0;
    let pointerMoves = 0;
    canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointermove", (e) => {
      pointerMoves++;
      const nx = (e.clientX / innerWidth) * 2 - 1;
      const ny = -((e.clientY / innerHeight) * 2 - 1);
      uniforms.uPointer.value.set(nx * 1.4, ny * 1.4, 1).normalize();
      if (dragging) {
        sphere.rotation.y += (e.clientX - lastX) * 0.008;
        sphere.rotation.x += (e.clientY - lastY) * 0.008;
        lastX = e.clientX; lastY = e.clientY;
      }
    });

    controls.forEach((key) => {
      const input = document.querySelector(`#${key}`);
      input.addEventListener("input", () => {
        uniforms["u" + key[0].toUpperCase() + key.slice(1)].value = Number(input.value);
        input.nextElementSibling.value = Number(input.value).toFixed(3);
      });
    });

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    let frames = 0;
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      uniforms.uTime.value = clock.getElapsedTime();
      sphere.rotation.y += dragging ? 0 : 0.0015;
      renderer.render(scene, camera);
      frames++;
    });

    // ---- Bake + export via pinned GLTFExporter r0.183.2 ----
    // Bake resolves the shared surface function into a UV-space texture that
    // matches SphereGeometry's parametrization (u = azimuth, v = 1 at +Y pole).
    const BAKE_W = 2048, BAKE_H = 1024;
    function bakeSurfaceTexture(T) {
      const rt = new THREE.WebGLRenderTarget(BAKE_W, BAKE_H);
      const bakeScene = new THREE.Scene();
      const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const bakeMat = new THREE.ShaderMaterial({
        uniforms: {
          uBakeT: { value: T },
          uFlow:  { value: uniforms.uFlow.value },
          uHeat:  { value: uniforms.uHeat.value },
        },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
        fragmentShader: /* glsl */`
          uniform float uBakeT; uniform float uFlow; uniform float uHeat;
          varying vec2 vUv;
          ${SHARED_GLSL}
          void main() {
            float PI = 3.141592653589793;
            float theta = (1.0 - vUv.y) * PI;
            float phi = vUv.x * 2.0 * PI;
            vec3 n = vec3(-cos(phi) * sin(theta), cos(theta), sin(phi) * sin(theta));
            gl_FragColor = vec4(relaySurface(n, uBakeT, uFlow, uHeat), 1.0);
          }
        `,
      });
      bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMat));
      renderer.setRenderTarget(rt);
      renderer.render(bakeScene, bakeCam);
      const pixels = new Uint8Array(BAKE_W * BAKE_H * 4);
      renderer.readRenderTargetPixels(rt, 0, 0, BAKE_W, BAKE_H, pixels);
      renderer.setRenderTarget(null);
      rt.dispose(); bakeMat.dispose();

      // GPU readback is bottom-up; write into the canvas top-down.
      const cnv = document.createElement("canvas");
      cnv.width = BAKE_W; cnv.height = BAKE_H;
      const ctx = cnv.getContext("2d");
      const img = ctx.createImageData(BAKE_W, BAKE_H);
      for (let y = 0; y < BAKE_H; y++) {
        const src = (BAKE_H - 1 - y) * BAKE_W * 4;
        img.data.set(pixels.subarray(src, src + BAKE_W * 4), y * BAKE_W * 4);
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(cnv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // JS mirror of relayDisp so the exported mesh matches the frozen morph state.
    function relayDispJS(px, py, pz, T, morph) {
      return morph * (
        0.10 * Math.sin(px * 5.0 + T * 1.4) * Math.sin(py * 4.0 - T * 1.1)
      + 0.08 * Math.sin(pz * 6.0 + T * 1.7)
      + 0.05 * Math.sin((px + py + pz) * 8.0 - T * 2.0)
      );
    }

    function buildExportScene() {
      const T = uniforms.uTime.value * (0.4 + uniforms.uFlow.value * 1.2);
      const geo = new THREE.SphereGeometry(RADIUS, 128, 96);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const len = Math.hypot(x, y, z) || 1;
        const nx = x / len, ny = y / len, nz = z / len;
        const d = relayDispJS(nx, ny, nz, T, uniforms.uMorph.value);
        pos.setXYZ(i, x + nx * d, y + ny * d, z + nz * d);
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();

      const baked = bakeSurfaceTexture(T);
      const mat = new THREE.MeshStandardMaterial({
        map: baked,
        emissive: new THREE.Color(0xffffff),
        emissiveMap: baked,
        emissiveIntensity: 0.25 + 0.75 * uniforms.uHeat.value,
        roughness: 0.35,
        metalness: 0.05,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = "BlueSphere_BakedV1";
      mesh.rotation.copy(sphere.rotation);
      const exportScene = new THREE.Scene();
      exportScene.name = "RelayBlueSphereShader_v1_bake";
      exportScene.add(mesh);
      return { exportScene, frozen: {
        T, morph: uniforms.uMorph.value, flow: uniforms.uFlow.value, heat: uniforms.uHeat.value,
      } };
    }

    async function exportGLB() {
      setStatus("Baking + exporting GLB…", "pinned three.js GLTFExporter r0.183.2");
      const { exportScene, frozen } = buildExportScene();
      const buffer = await new Promise((resolve, reject) =>
        new GLTFExporter().parse(exportScene, resolve, reject, { binary: true })
      );
      const bytes = new Uint8Array(buffer);
      const hashBuf = await crypto.subtle.digest("SHA-256", bytes);
      const sha256 = [...new Uint8Array(hashBuf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      let base64 = "";
      for (let i = 0; i < bytes.length; i += 0x8000) {
        base64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      base64 = btoa(base64);
      setStatus("GLB exported", `${bytes.length} bytes · sha256 ${sha256.slice(0, 16)}… · frozen T=${frozen.T.toFixed(3)}`);
      return { base64, byteLength: bytes.length, sha256, frozen, exporter: "three@0.183.2 GLTFExporter" };
    }

    document.querySelector("#exportBtn").addEventListener("click", async () => {
      const { base64 } = await exportGLB();
      const a = document.createElement("a");
      a.href = "data:model/gltf-binary;base64," + base64;
      a.download = "BlueSphereShader_v1_bake.glb";
      a.click();
    });

    window.RelayBlueSphere = {
      exportGLB,
      setControl(name, value) {
        if (!controls.includes(name)) return;
        const input = document.querySelector(`#${name}`);
        input.value = String(value);
        input.dispatchEvent(new Event("input"));
      },
      getState: () => ({
        revision: THREE.REVISION,
        frames,
        pointerMoves,
        time: uniforms.uTime.value,
        controls: Object.fromEntries(controls.map((k) => [k, uniforms["u" + k[0].toUpperCase() + k.slice(1)].value])),
        rotation: { x: sphere.rotation.x, y: sphere.rotation.y },
      }),
    };

    setStatus("Live GLSL runtime running", `three r${THREE.REVISION} · morph/flow/heat + pointer mapped to shader uniforms`);
  </script>
</body>
</html>
