<!doctype html>
<!-- vanguard-golf-sdf-v5 · glass HUD iteration · base: v1 frozen master -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Relay · VanguardGolfSDF_v5</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%2339ff6a'/></svg>">
  <style>
    :root{
      color-scheme:dark;
      /* ── palette ─────────────────────────────────────────────── */
      --accent:#39ff6a;
      --accent-hi:#b9ffce;
      --accent-glow:rgba(57,255,106,.45);
      --ink:#ecfff2;
      --ink-dim:rgba(219,248,229,.78);
      --ink-faint:rgba(197,235,209,.60);
      /* ── glass elevation scale (1 = chips, 2 = panel, 3 = modal) ─ */
      --glass-blur-1:14px;  --glass-sat-1:150%;
      --glass-blur-2:28px;  --glass-sat-2:195%;
      --glass-blur-3:40px;  --glass-sat-3:200%;
      --glass-fill-1:rgba(9,23,14,.30);
      --glass-fill-2:rgba(7,20,12,.36);
      --glass-fill-3:rgba(5,17,10,.48);
      --glass-shadow-1:0 6px 20px rgba(0,2,1,.38);
      --glass-shadow-2:0 20px 56px rgba(0,3,1,.5);
      --glass-shadow-3:0 32px 88px rgba(0,3,1,.62);
      /* ── hairlines & sheen ───────────────────────────────────── */
      --hair-hi:rgba(255,255,255,.30);
      --hair-mid:rgba(255,255,255,.10);
      --hair-lo:rgba(0,0,0,.42);
      --grain-opacity:.05;
      /* ── shape & motion ──────────────────────────────────────── */
      --radius-lg:22px; --radius-md:14px; --radius-pill:999px;
      --ease:cubic-bezier(.4,0,.2,1);
      --dur:180ms;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020805;color:var(--ink);
      font-family:"SF Pro Display",Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased}
    canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

    /* ── glass material ─────────────────────────────────────────── */
    .glass{
      position:relative;
      border:1px solid var(--hair-mid);
      background:
        linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.015) 42%,rgba(2,10,5,.06)),
        var(--glass-fill-2);
      -webkit-backdrop-filter:blur(var(--glass-blur-2)) saturate(var(--glass-sat-2));
      backdrop-filter:blur(var(--glass-blur-2)) saturate(var(--glass-sat-2));
      box-shadow:
        var(--glass-shadow-2),
        inset 0 1px 0 var(--hair-hi),
        inset 1px 0 0 rgba(255,255,255,.08),
        inset 0 -1px 0 var(--hair-lo),
        inset -1px 0 0 rgba(0,0,0,.20);
    }
    .glass::before{ /* top sheen */
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 36%);
    }
    .glass::after{ /* fine grain so the blur never bands */
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      opacity:var(--grain-opacity);mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    }
    .glass.e1{
      background:
        linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.012) 45%,rgba(2,10,5,.05)),
        var(--glass-fill-1);
      -webkit-backdrop-filter:blur(var(--glass-blur-1)) saturate(var(--glass-sat-1));
      backdrop-filter:blur(var(--glass-blur-1)) saturate(var(--glass-sat-1));
      box-shadow:
        var(--glass-shadow-1),
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -1px 0 rgba(0,0,0,.32);
    }
    @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
      .glass{background:rgba(5,16,10,.93)}
      .glass.e1{background:rgba(6,18,11,.90)}
    }

    /* ── primary control panel (elevation 2) ────────────────────── */
    .hud{
      position:fixed;z-index:20;top:16px;left:16px;
      width:min(400px,calc(100vw - 32px));
      padding:16px 18px 15px;
      border-radius:var(--radius-lg);
      animation:hud-in 520ms var(--ease) both;
    }
    @keyframes hud-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    .top{display:flex;align-items:center;gap:10px}
    .brand{font-size:15px;font-weight:700;letter-spacing:-.015em;
      background:linear-gradient(120deg,#f2fff6 30%,#9fffc0 75%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 1px 12px rgba(57,255,106,.12)}
    .badge{margin-left:auto;font:700 8.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.16em;color:var(--accent-hi);
      border:1px solid rgba(120,255,160,.22);border-radius:var(--radius-pill);
      padding:6px 9px;background:rgba(30,90,48,.22);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 14px rgba(57,255,106,.10)}
    .fold{
      flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;
      border:1px solid var(--hair-mid);border-radius:50%;cursor:pointer;
      background:rgba(255,255,255,.05);color:var(--ink-dim);padding:0;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 6px rgba(0,0,0,.3);
      transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    }
    .fold:hover{background:rgba(255,255,255,.10);color:var(--ink);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 12px var(--accent-glow)}
    .fold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .fold svg{transition:transform 260ms var(--ease)}
    .hud.collapsed .fold svg{transform:rotate(-180deg)}
    .hud-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows 280ms var(--ease)}
    .hud-body-inner{overflow:hidden;min-height:0}
    .hud.collapsed .hud-body{grid-template-rows:0fr}

    /* ── controls ────────────────────────────────────────────────── */
    .controls{display:grid;grid-template-columns:60px 1fr 52px;gap:9px 12px;align-items:center;margin-top:15px}
    .controls label{
      font-size:9.5px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;
      color:var(--ink-dim);transition:color var(--dur) var(--ease)}
    .controls label:hover{color:var(--ink)}
    output{
      font:600 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbffdb;
      text-align:center;padding:5px 4px;border-radius:8px;
      background:rgba(1,8,4,.48);border:1px solid rgba(255,255,255,.09);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.04)}

    input[type=range]{
      -webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;padding:0;
      background:transparent;cursor:pointer;--p:50%;
    }
    input[type=range]::-webkit-slider-runnable-track{
      height:5px;border-radius:var(--radius-pill);
      background:linear-gradient(90deg,
        rgba(57,255,106,.95),rgba(170,255,197,.85) var(--p),
        rgba(4,14,8,.52) var(--p),rgba(4,14,8,.46));
      box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.05),
        0 0 10px rgba(57,255,106,.08);
    }
    input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;
      background:radial-gradient(circle at 34% 28%,#ffffff,#c9ffdb 32%,var(--accent) 72%,#17c94b);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.55),0 0 10px var(--accent-glow);
      transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    }
    input[type=range]:hover::-webkit-slider-thumb{
      transform:scale(1.10);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.6),0 0 18px var(--accent-glow)}
    input[type=range]:active::-webkit-slider-thumb{
      transform:scale(1.18);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 3px 10px rgba(0,0,0,.65),
        0 0 26px rgba(57,255,106,.7),0 0 52px rgba(57,255,106,.28)}
    input[type=range]:focus-visible{outline:none}
    input[type=range]:focus-visible::-webkit-slider-thumb{
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.6),
        0 0 0 3px rgba(57,255,106,.35),0 0 18px var(--accent-glow)}
    input[type=range]::-moz-range-track{
      height:5px;border-radius:var(--radius-pill);background:rgba(255,255,255,.08);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
    input[type=range]::-moz-range-progress{
      height:5px;border-radius:var(--radius-pill);
      background:linear-gradient(90deg,rgba(57,255,106,.85),rgba(150,255,182,.70))}
    input[type=range]::-moz-range-thumb{
      width:17px;height:17px;border:none;border-radius:50%;
      background:radial-gradient(circle at 34% 28%,#ffffff,#c9ffdb 32%,var(--accent) 72%,#17c94b);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.55),0 0 10px var(--accent-glow)}

    /* ── status line ─────────────────────────────────────────────── */
    .status{
      margin:14px 0 0;padding:9px 11px;border-radius:var(--radius-md);
      color:var(--ink-faint);font:500 9.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
      background:rgba(1,8,4,.44);border:1px solid rgba(255,255,255,.07);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
    .status b{color:#c8ffd4;font-weight:650}

    /* ── telemetry dock (elevation 1 chips, bottom-right) ────────── */
    .dock{position:fixed;z-index:10;right:16px;bottom:16px;display:flex;flex-direction:column;
      align-items:flex-end;gap:8px;pointer-events:none}
    .chip{
      display:flex;align-items:center;gap:8px;border-radius:var(--radius-pill);
      padding:8px 13px;font:600 9.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.08em;color:var(--ink-dim)}
    .chip b{color:#d6ffe2;font-weight:700}
    .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 8px var(--accent-glow);animation:pulse 2.4s var(--ease) infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .chip .sep{width:1px;height:10px;background:rgba(255,255,255,.14)}
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <section class="hud glass" id="hud" aria-label="Vanguard golf SDF controls">
    <div class="top">
      <div class="brand">VanguardGolfSDF · v5</div>
      <div class="badge">GLASS HUD · UBER LINEAGE</div>
      <button class="fold" id="fold" aria-expanded="true" aria-label="Collapse panel">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2 7.5 6 3.5 10 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hud-body">
      <div class="hud-body-inner">
        <div class="controls">
          <label for="morph">Morph</label><input id="morph" type="range" min="0" max="1" step=".001" value=".62"><output>.620</output>
          <label for="flow">Flow</label><input id="flow" type="range" min="0" max="1" step=".001" value=".48"><output>.480</output>
          <label for="heat">Heat</label><input id="heat" type="range" min="0" max="1" step=".001" value=".78"><output>.780</output>
          <label for="glass">Glass</label><input id="glass" type="range" min="0" max="1" step=".001" value=".72"><output>.720</output>
        </div>
        <p class="status" id="status"><b>Booting layered SDF golf course…</b></p>
      </div>
    </div>
  </section>
  <div class="dock">
    <div class="chip glass e1"><span class="dot"></span>FPS <b id="fpsOut">—</b><span class="sep"></span><b id="frameOut">0</b> frames</div>
    <div class="chip glass e1">Drag orbit · pointer drives grass ripple · VanguardUber contract</div>
  </div>

  <script type="module">
    // Exact-runtime master for VanguardGolfSDF_v5 (shader/API inherited from v1).
    // Noise/fresnel/gradient/emissive/ripple contracts mirror VanguardUber + VanguardNoise.
    // Geometry is a labeled SDF level instrument (Uber itself is a surface shader, not SDF).

    const canvas = document.querySelector("#gl");
    const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
    if (!gl) throw new Error("WebGL2 required");

    const VS = `#version 300 es
    precision highp float;
    const vec2 P[3] = vec2[3](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
    void main(){ gl_Position = vec4(P[gl_VertexID], 0.0, 1.0); }`;

    const FS = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    uniform vec2  uResolution;
    uniform float uTime;
    uniform float uMorph;
    uniform float uFlow;
    uniform float uHeat;
    uniform float uGlass;
    uniform vec2  uPointer;   // NDC [-1,1]
    uniform vec2  uOrbit;     // yaw, pitch

    // ── VanguardNoise (GLSL port of VanguardNoise.hlsl) ────────────────────
    float Vanguard_Hash21(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    vec2 Vanguard_Hash22(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.xx + p3.yz) * p3.zy);
    }
    float Vanguard_ValueNoise(vec2 uv) {
      vec2 i = floor(uv), f = fract(uv);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = Vanguard_Hash21(i);
      float b = Vanguard_Hash21(i + vec2(1,0));
      float c = Vanguard_Hash21(i + vec2(0,1));
      float d = Vanguard_Hash21(i + vec2(1,1));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float Vanguard_FBM(vec2 uv, int octaves) {
      float value = 0.0, amplitude = 0.5, frequency = 1.0;
      for (int i = 0; i < 8; i++) {
        if (i >= octaves) break;
        value += amplitude * Vanguard_ValueNoise(uv * frequency);
        amplitude *= 0.5; frequency *= 2.0;
      }
      return value;
    }
    vec2 Vanguard_Voronoi(vec2 uv) {
      vec2 i = floor(uv), f = fract(uv);
      float F1 = 8.0, F2 = 8.0;
      for (int y = -2; y <= 2; y++)
      for (int x = -2; x <= 2; x++) {
        vec2 cell = vec2(float(x), float(y));
        vec2 jitter = Vanguard_Hash22(i + cell);
        vec2 delta = cell + jitter - f;
        float d = dot(delta, delta);
        if (d < F1) { F2 = F1; F1 = d; }
        else if (d < F2) F2 = d;
      }
      return vec2(sqrt(F1), sqrt(F2));
    }

    // ── Golf course SDF (layered) ─────────────────────────────────────────
    float terrainH(vec2 xz) {
      float hills = Vanguard_FBM(xz * 0.085, 5);
      float ridges = Vanguard_FBM(xz * 0.22 + 17.0, 3);
      float amp = mix(0.55, 2.35, uMorph);
      return hills * amp + ridges * amp * 0.35 - 0.15;
    }

    // Putting green depressions + cup
    float greenMask(vec2 xz) {
      float g1 = length(xz - vec2( 6.5, -3.0));
      float g2 = length(xz - vec2(-5.0,  4.5));
      float g3 = length(xz - vec2( 1.5,  7.0));
      return min(g1, min(g2, g3));
    }

    float sdTerrain(vec3 p) {
      float h = terrainH(p.xz);
      float g = greenMask(p.xz);
      float greenDip = smoothstep(3.2, 1.1, g) * 0.55;
      float cup = length(vec2(length(p.xz - vec2(6.5,-3.0)), p.y - (h - greenDip - 0.08))) - 0.07;
      float ground = p.y - (h - greenDip);
      return min(ground, cup);
    }

    // Layered grass shell — Voronoi blades as thin SDF layer above terrain
    float sdGrassLayer(vec3 p, float layer) {
      float h = terrainH(p.xz);
      float g = greenMask(p.xz);
      float onGreen = smoothstep(2.4, 1.0, g);
      float blade = Vanguard_Voronoi(p.xz * mix(9.0, 16.0, layer) + vec2(layer * 3.1, uTime * uFlow * (0.4 + layer))).x;
      float height = mix(0.18, 0.42, layer) * (1.0 - onGreen * 0.85) * (0.55 + uMorph * 0.45);
      float wind = sin(p.x * 2.4 + p.z * 1.7 + uTime * (1.2 + uFlow * 3.0) + layer * 2.0) * 0.04 * uFlow;
      float top = h + height + wind - onGreen * 0.4;
      float d = p.y - top;
      // thin shell thickness modulated by voronoi so blades read as layered SDF grass
      float shell = abs(d) - mix(0.012, 0.028, blade);
      return mix(shell, 1e3, onGreen); // suppress tall grass on greens
    }

    // Glass fairway sheet — smooth refractive layer over fairway corridors
    float sdGlassFairway(vec3 p) {
      float h = terrainH(p.xz);
      float g = greenMask(p.xz);
      float fair = smoothstep(7.5, 2.8, abs(p.x * 0.35 + p.z * 0.15)) *
                   smoothstep(12.0, 4.0, length(p.xz * vec2(0.55, 1.0)));
      float sheet = abs(p.y - (h + 0.03)) - 0.01;
      return mix(1e3, sheet, fair * (0.35 + uGlass * 0.65));
    }

    float mapScene(vec3 p) {
      float d = sdTerrain(p);
      d = min(d, sdGrassLayer(p, 0.0));
      d = min(d, sdGrassLayer(p, 0.45));
      d = min(d, sdGrassLayer(p, 0.85));
      d = min(d, sdGlassFairway(p));
      return d;
    }

    vec3 calcNormal(vec3 p) {
      vec2 e = vec2(0.0025, 0.0);
      return normalize(vec3(
        mapScene(p + e.xyy) - mapScene(p - e.xyy),
        mapScene(p + e.yxy) - mapScene(p - e.yxy),
        mapScene(p + e.yyx) - mapScene(p - e.yyx)));
    }

    // VanguardUber-style gradient (green neon)
    vec3 applyGradient(vec3 base, vec2 uv) {
      float ang = 55.0 * 0.017453292;
      vec2 dir = vec2(cos(ang), sin(ang));
      float t = clamp(dot(uv - 0.5, dir) + 0.5, 0.0, 1.0);
      vec3 a = vec3(0.015, 0.18, 0.05);   // deep turf
      vec3 b = vec3(0.25, 1.0, 0.35);     // neon lime
      return mix(base, base * mix(a, b, t) * 2.2, 0.85);
    }

    // VanguardUber-style fresnel glass
    vec3 applyFresnel(vec3 base, vec3 n, vec3 v) {
      float ndv = clamp(1.0 - dot(n, v), 0.0, 1.0);
      float fres = pow(ndv, mix(1.4, 3.2, uGlass)) * (0.35 + uGlass * 1.4);
      vec3 glassCol = vec3(0.55, 1.0, 0.75);
      return base + glassCol * fres * uGlass;
    }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec2 uv = (frag - 0.5 * uResolution) / uResolution.y;

      float yaw = uOrbit.x;
      float pitch = clamp(uOrbit.y, -0.55, 0.85);
      vec3 ro = vec3(sin(yaw) * 11.0, 4.8 + pitch * 3.5, cos(yaw) * 11.0);
      vec3 ta = vec3(0.0, 0.6, 0.0);
      vec3 ww = normalize(ta - ro);
      vec3 uu = normalize(cross(ww, vec3(0,1,0)));
      vec3 vv = cross(uu, ww);
      vec3 rd = normalize(uu * uv.x + vv * uv.y + ww * 1.55);

      // pointer-driven grass ripple (Uber ripple contract)
      float ripple = 0.0;
      if (length(uPointer) > 0.01) {
        vec2 hitXZ = ro.xz + rd.xz * ((0.8 - ro.y) / max(rd.y, 0.02));
        float dist = length(hitXZ - uPointer * 8.0);
        ripple = exp(-dist * 0.55) * sin(dist * 14.0 - uTime * 5.0) * 0.08;
      }

      float t = 0.0;
      bool hit = false;
      vec3 pos;
      for (int i = 0; i < 96; i++) {
        pos = ro + rd * t;
        pos.y += ripple * 0.35;
        float d = mapScene(pos);
        if (d < 0.0015) { hit = true; break; }
        t += d * 0.85;
        if (t > 55.0) break;
      }

      vec3 col = mix(vec3(0.01, 0.03, 0.02), vec3(0.02, 0.08, 0.04), uv.y + 0.5);
      // neon fog
      col += vec3(0.0, 0.15, 0.05) * (0.15 + uHeat * 0.25) * (1.0 - exp(-length(uv) * 0.4));

      if (hit) {
        vec3 n = calcNormal(pos);
        vec3 v = normalize(-rd);
        vec3 light = normalize(vec3(0.45, 0.85, 0.35));
        float diff = clamp(dot(n, light), 0.0, 1.0);
        float spec = pow(clamp(dot(reflect(-light, n), v), 0.0, 1.0), mix(16.0, 64.0, uGlass));

        float h = terrainH(pos.xz);
        float grassAmt = smoothstep(0.02, 0.22, pos.y - h);
        float g = greenMask(pos.xz);
        float onGreen = smoothstep(2.6, 1.0, g);

        vec3 turf = vec3(0.04, 0.28, 0.08);
        vec3 neon = vec3(0.2, 1.0, 0.38);
        vec3 greenPad = vec3(0.08, 0.55, 0.22);
        vec3 albedo = mix(turf, neon, grassAmt * (0.35 + uHeat * 0.65));
        albedo = mix(albedo, greenPad, onGreen * 0.85);
        albedo = applyGradient(albedo, pos.xz * 0.05 + 0.5);

        col = albedo * (0.18 + diff * 0.85);
        col += neon * spec * (0.15 + uGlass * 0.55 + uHeat * 0.35);
        col = applyFresnel(col, n, v);

        // emissive neon heat (Uber emissive)
        float pulse = 0.5 + 0.5 * sin(uTime * 2.2 + pos.x * 0.4);
        col += neon * uHeat * pulse * grassAmt * 0.35;

        // distance fog
        float fog = 1.0 - exp(-t * 0.035);
        col = mix(col, vec3(0.02, 0.07, 0.04), fog);
      }

      // soft vignette
      col *= 1.0 - 0.22 * dot(uv, uv);
      col = pow(max(col, 0.0), vec3(0.92));
      fragColor = vec4(col, 1.0);
    }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(prog) || "link failed");
    gl.useProgram(prog);

    const U = Object.fromEntries(
      ["uResolution","uTime","uMorph","uFlow","uHeat","uGlass","uPointer","uOrbit"]
        .map((n) => [n, gl.getUniformLocation(prog, n)])
    );

    const controls = ["morph","flow","heat","glass"];
    const state = { morph: 0.62, flow: 0.48, heat: 0.78, glass: 0.72 };
    const orbit = { yaw: 0.55, pitch: 0.18 };
    const pointer = { x: 0, y: 0 };
    let dragging = false, lastX = 0, lastY = 0, pointerMoves = 0, frames = 0;

    // glass HUD: paint the slider progress fill into a CSS custom property
    function paintFill(input) {
      const min = Number(input.min) || 0, max = Number(input.max) || 1;
      const p = ((Number(input.value) - min) / (max - min)) * 100;
      input.style.setProperty("--p", p.toFixed(2) + "%");
    }

    controls.forEach((key) => {
      const input = document.querySelector(`#${key}`);
      paintFill(input);
      input.addEventListener("input", () => {
        state[key] = Number(input.value);
        input.nextElementSibling.value = state[key].toFixed(3);
        paintFill(input);
      });
    });

    // glass HUD: collapse / expand
    const hud = document.querySelector("#hud");
    const fold = document.querySelector("#fold");
    fold.addEventListener("click", () => {
      const collapsed = hud.classList.toggle("collapsed");
      fold.setAttribute("aria-expanded", String(!collapsed));
      fold.setAttribute("aria-label", collapsed ? "Expand panel" : "Collapse panel");
    });

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointermove", (e) => {
      pointerMoves++;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / innerHeight) * 2 - 1);
      if (dragging) {
        orbit.yaw += (e.clientX - lastX) * 0.005;
        orbit.pitch += (e.clientY - lastY) * 0.004;
        lastX = e.clientX; lastY = e.clientY;
      }
    });

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    addEventListener("resize", resize);
    resize();

    // telemetry chip
    const fpsOut = document.querySelector("#fpsOut");
    const frameOut = document.querySelector("#frameOut");
    let fps = 0, fpsFrames = 0, fpsT = performance.now();

    const t0 = performance.now();
    function frame(now) {
      gl.uniform2f(U.uResolution, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, (now - t0) * 0.001);
      gl.uniform1f(U.uMorph, state.morph);
      gl.uniform1f(U.uFlow, state.flow);
      gl.uniform1f(U.uHeat, state.heat);
      gl.uniform1f(U.uGlass, state.glass);
      gl.uniform2f(U.uPointer, pointer.x, pointer.y);
      gl.uniform2f(U.uOrbit, orbit.yaw, orbit.pitch);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      frames++; fpsFrames++;
      if (now - fpsT >= 500) {
        fps = (fpsFrames * 1000) / (now - fpsT);
        fpsOut.textContent = fps.toFixed(0);
        frameOut.textContent = String(frames);
        fpsFrames = 0; fpsT = now;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    document.querySelector("#status").innerHTML =
      `<b>Live SDF golf course running</b><br>VanguardNoise + Uber fresnel/gradient/emissive/ripple · layered grass · glass fairway`;

    window.RelayVanguardGolf = {
      setControl(name, value) {
        if (!(name in state)) return;
        state[name] = Number(value);
        const input = document.querySelector(`#${name}`);
        if (input) { input.value = String(value); input.nextElementSibling.value = Number(value).toFixed(3); paintFill(input); }
      },
      getState: () => ({ frames, pointerMoves, fps, ...state, orbit: { ...orbit }, pointer: { ...pointer }, time: (performance.now() - t0) * 0.001 }),
    };
  </script>
</body>
</html>
